# Checks on PRs to main and on version tags; release build + publish to
# GitHub Releases on version tags.
#
# The merge to main is deliberately not a trigger: the PR run already
# covered it, and the tag run re-checks what actually ships. This relies on
# the branch protection rule for main requiring branches to be up to date
# before merging, so a PR whose base moved is re-checked before it lands.
#
# Release ritual: merge to main, then bump and tag on main — see
# docs/releasing.md for the full procedure and off-script cases. In short:
#   1. On main, in sync with origin, bump "version" in package.json, commit.
#   2. npm run release:tag (guards the order above, pushes the tag).
#   3. The pipeline applies the new migrations and deploys the edge functions
#      to the hosted Supabase project, then builds the Windows installer,
#      uploads it to a DRAFT release, and fills the draft's body from the
#      merged PRs' user-facing notes — review it on GitHub and click "Publish
#      release" to ship it to the auto-updater feed.
#
# Test database:
#   The "checks" job starts a local Supabase on the runner (`supabase start`:
#   migrations + seed.sql, thrown away with the runner) and builds the app
#   against it. No hosted project is involved; the end-to-end suite can never
#   reach production data. The runner's URL/keys are exported into the job
#   env by the "Export local Supabase credentials" step.
#
# Production database:
#   The "deploy" job is the only path by which migrations and edge functions
#   reach the hosted project: `supabase db push`, then `supabase functions
#   deploy`, on a version tag only, after the checks pass and before the
#   installer is built — so the schema a release expects is live before the
#   release exists. Nobody pushes migrations by hand.
#
# Secrets (Settings → Secrets and variables → Actions), release job only:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY  (baked into the renderer bundle)
#   VITE_SENTRY_DSN                            (leave unset to disable Sentry)
#   SENTRY_ORG, SENTRY_PROJECT, SENTRY_AUTH_TOKEN  (source map upload)
#
# Secrets, deploy job only:
#   SUPABASE_ACCESS_TOKEN  (a personal access token of a project member)
#   SUPABASE_PROJECT_ID    (the hosted project's ref)
#   SUPABASE_DB_PASSWORD   (the hosted database's postgres password)
#
# Variables (Settings → Secrets and variables → Actions → Variables), both jobs:
#   VITE_GITHUB_RELEASES_URL  (the app's own GitHub Releases API URL; public,
#                              so a variable rather than a secret)
#
# The build refuses to run without every required VITE_ key (see
# vite.config.ts). Nothing here has a default: an unset variable expands to
# an empty string and the Build step fails naming it.

name: CI

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  VITE_GITHUB_RELEASES_URL: ${{ vars.VITE_GITHUB_RELEASES_URL }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        # Non-blocking until the pre-existing lint errors (set-state-in-effect,
        # react-refresh/only-export-components) are cleaned up; flip to
        # blocking afterwards.
        run: npm run lint
        continue-on-error: true

      - uses: supabase/setup-cli@v1
        with:
          # Keep in step with the CLI version developers run locally.
          version: 2.84.2
      - name: Write the edge function variables
        # supabase/functions/.env is git-ignored, and the edge runtime reads it
        # when it starts. Dry run and placeholder addresses: no secret is
        # needed, and no mail can leave the runner. The webhook secret is a
        # throwaway of the right shape (`whsec_` + base64): email-webhook
        # verifies against it, and the e2e runner, which loads this file
        # too, signs its test reports with it.
        run: |
          cat > supabase/functions/.env <<'EOF'
          EMAIL_DRY_RUN=true
          EMAIL_FROM=ci@example.test
          EMAIL_REPLY_TO=ci@example.test
          EMAIL_SHOP_TO=ci@example.test
          RESEND_WEBHOOK_SECRET=whsec_Y2ktd2ViaG9vay1zZWNyZXQ=
          EOF
      - name: Start local Supabase
        # Only the services the app talks to (postgres, kong, gotrue,
        # postgrest, realtime, storage, edge-runtime); the rest would just
        # slow the start.
        # Prints "WARN: environment variable is unset" for the Google OAuth
        # pair referenced in config.toml — harmless: the provider config is
        # left empty and the OAuth flow is never exercised here.
        run: supabase start -x studio,postgres-meta,imgproxy,mailpit,logflare,vector,supavisor
      - name: Export local Supabase credentials
        # The build inlines the VITE_ pair; the service-role key is for the
        # e2e runner's test-data client only and never reaches the bundle.
        run: |
          eval "$(supabase status -o env)"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Boot the edge functions
        # A function only boots on its first request. send-email reads and
        # parses every registered template when it boots, so a missing or
        # broken template fails the PR here rather than the first send after
        # deploy. The drain finds an empty queue and sends nothing.
        # email-webhook reads its secret when it boots; an unsigned report
        # is refused with 401, which is what proves it is up.
        run: |
          curl -sS --fail-with-body -X POST "$VITE_SUPABASE_URL/functions/v1/send-email" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H 'Content-Type: application/json' -d '{"action":"drain"}'
          curl -sS --fail-with-body -X OPTIONS "$VITE_SUPABASE_URL/functions/v1/manage-users" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$VITE_SUPABASE_URL/functions/v1/email-webhook" \
            -H 'Content-Type: application/json' -d '{}')
          test "$status" = 401 || { echo "email-webhook answered $status instead of 401"; exit 1; }

      - name: Build
        run: npm run build
      - name: Install Electron system dependencies
        run: npx playwright install-deps chromium
      - name: End-to-end tests
        # `npx playwright test` rather than `npm run test:e2e` so the build
        # above isn't repeated. Electron needs a display on Linux → xvfb.
        # Drop --pass-with-no-tests once the first spec is in e2e/.
        run: xvfb-run --auto-servernum npx playwright test --pass-with-no-tests
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  deploy:
    name: Deploy migrations & edge functions
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    # Docker is present on ubuntu runners, so the CLI bundles the functions
    # locally — the same path that ships send-email's static template files.
    runs-on: ubuntu-latest
    # Two tags pushed close together deploy one after the other, never at
    # once.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Same version as the checks job.
          version: 2.84.2
      - name: Link the hosted project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Apply migrations
        # Applies the repo's migrations the hosted history lacks; seed.sql is
        # never pushed. Refuses if the hosted history has a migration the repo
        # does not.
        run: supabase db push --yes
      - name: Deploy edge functions
        # Every function under supabase/functions/, with its config.toml
        # settings (verify_jwt, static_files). Function secrets are set on the
        # hosted project by hand and are not touched here.
        run: supabase functions deploy

  release:
    name: Build & publish Windows installer
    needs: [checks, deploy]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write # create the release and upload artifacts
      pull-requests: read # release-notes.mjs reads merged PRs via `gh pr list`
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release-notes.mjs walks tag ranges and merge-base ancestry
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Guard - tag must match package.json version
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
      - run: npm ci
      - name: Create the draft release
        # electron-builder uploads the installer set and the .blockmap through
        # two publishers that each find-or-create the release at the same
        # moment; with no release yet, both create one and the tag ends up with
        # two drafts (electron-builder#6676). Creating the one draft here first
        # leaves both nothing to create. A rerun reuses the existing draft.
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | if .draft then \"draft\" else \"published\" end")
          if echo "$EXISTING" | grep -qx published; then
            echo "$TAG is already published; bump the version instead of re-releasing this tag." >&2
            exit 1
          fi
          DRAFTS=$(echo "$EXISTING" | grep -cx draft || true)
          if [ "$DRAFTS" -gt 1 ]; then
            echo "$DRAFTS draft releases exist for $TAG; delete all but one, then rerun." >&2
            exit 1
          fi
          if [ "$DRAFTS" -eq 1 ]; then
            echo "Reusing the existing draft release for $TAG."
          else
            gh release create "$TAG" --draft --verify-tag --title "${TAG#v}" --notes ""
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Assemble release notes
        shell: bash
        run: node scripts/release-notes.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
