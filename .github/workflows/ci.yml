# CI on pushes/PRs to main; release build + publish to GitHub Releases on version tags.
#
# Release ritual: merge to main, then bump and tag on main — see
# docs/releasing.md for the full procedure and off-script cases. In short:
#   1. On main, in sync with origin, bump "version" in package.json, commit.
#   2. npm run release:tag (guards the order above, pushes the tag).
#   3. The pipeline builds the Windows installer, uploads it to a DRAFT
#      release, and fills the draft's body from the merged PRs' user-facing
#      notes — review it on GitHub and click "Publish release" to ship it
#      to the auto-updater feed.
#
# Test database:
#   The "checks" job starts a local Supabase on the runner (`supabase start`:
#   migrations + seed.sql, thrown away with the runner) and builds the app
#   against it. No hosted project is involved; the end-to-end suite can never
#   reach production data. The runner's URL/keys are exported into the job
#   env by the "Export local Supabase credentials" step.
#
# Secrets (Settings → Secrets and variables → Actions), release job only:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY  (baked into the renderer bundle)
#   VITE_SENTRY_DSN                            (leave unset to disable Sentry)
#   SENTRY_ORG, SENTRY_PROJECT, SENTRY_AUTH_TOKEN  (source map upload)

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        # Non-blocking until the pre-existing lint errors (set-state-in-effect,
        # react-refresh/only-export-components) are cleaned up; flip to
        # blocking afterwards.
        run: npm run lint
        continue-on-error: true

      - uses: supabase/setup-cli@v1
        with:
          # Keep in step with the CLI version developers run locally.
          version: 2.84.2
      - name: Start local Supabase
        # Only the services the app talks to (postgres, kong, gotrue,
        # postgrest, realtime, storage); the rest would just slow the start.
        # Prints "WARN: environment variable is unset" for the Google OAuth
        # pair referenced in config.toml — harmless: the provider config is
        # left empty and the OAuth flow is never exercised here.
        run: supabase start -x studio,postgres-meta,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
      - name: Export local Supabase credentials
        # The build inlines the VITE_ pair; the service-role key is for the
        # e2e runner's test-data client only and never reaches the bundle.
        run: |
          eval "$(supabase status -o env)"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Build
        run: npm run build
      - name: Install Electron system dependencies
        run: npx playwright install-deps chromium
      - name: End-to-end tests
        # `npx playwright test` rather than `npm run test:e2e` so the build
        # above isn't repeated. Electron needs a display on Linux → xvfb.
        # Drop --pass-with-no-tests once the first spec is in e2e/.
        run: xvfb-run --auto-servernum npx playwright test --pass-with-no-tests
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  release:
    name: Build & publish Windows installer
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write # create the release and upload artifacts
      pull-requests: read # release-notes.mjs reads merged PRs via `gh pr list`
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release-notes.mjs walks tag ranges and merge-base ancestry
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Guard - tag must match package.json version
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
      - run: npm ci
      - name: Build and publish
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Assemble release notes
        shell: bash
        run: node scripts/release-notes.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
