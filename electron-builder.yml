# Windows packaging (WP7). Build with `npm run dist` — on a Windows checkout
# no extra tooling is needed; from Linux/WSL2 a Windows build requires Wine.
appId: com.arbeitsdenkmal.auftragssystem
productName: Auftragssystem
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  # Per-user install, no admin rights needed — right for the shop machines.
  oneClick: true
  perMachine: false
# No effect on Windows (deep-link registration happens at runtime in WP9's
# deepLinks.ts); kept for a possible future macOS build.
protocols:
  - name: Auftragssystem
    schemes: [auftrag]
